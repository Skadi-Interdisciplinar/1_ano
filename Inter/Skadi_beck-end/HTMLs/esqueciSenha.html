<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe o email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleEsqueci.css">
</head>
<body>

  <!-- Botão de voltar (volta para o login) -->
  <a href="loginCliente.html" class="back-btn" aria-label="Voltar">
    <img src="Imagens/seta.svg" alt="">
  </a>

  <div class="login-container">

    <!-- Bolas suaves de fundo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- LADO ESQUERDO: lobo -->
    <div class="left-side">
      <img class="illustration" src="Imagens/lobao.svg" alt="Lobo Skadi">
    </div>

    <!-- LADO DIREITO: conteúdo -->
    <div class="right-side">
      <a href="loginSistema.html" class="logo"><img src="Imagens/logo.svg" alt="Skadi"></a>

      <h2 class="titulo">Esqueceu a senha</h2>
      <p class="subtitulo">Informe seu e-mail para redefinir a sua senha</p>

      <form class="form" id="form-email">
        <div class="input-group">
          <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>
        </div>

        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
    </div>
  </div>

<script>
document.getElementById('form-email').addEventListener('submit', (e) => {
  e.preventDefault();
  sessionStorage.setItem('emailRecuperacao', document.getElementById('email').value.trim());
  window.location.href = 'esqueciCodigo.html';
});
</script>

</body>
</html>
