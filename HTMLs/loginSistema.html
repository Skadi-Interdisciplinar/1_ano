<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN CLIENTE</title>
  <link rel="stylesheet" href="styleLoginSistema.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- Botão de Voltar no canto superior esquerdo -->
  <a href="landing.html" class="back-btn" aria-label="Voltar">
  <img src="Imagens/seta_azul.svg">
</a>

  <!-- Container principal dividindo a tela em duas partes -->
  <div class="login-container">

    <!-- Bolas suaves de fundo -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

    <!-- LADO ESQUERDO: Ilustração da raposa/lobo -->
    <div class="left-side">
      <img class="illustration" src="Imagens/lobao.svg">
    </div>

    <!-- LADO DIREITO: Formulário de Login -->
    <div class="right-side">
    
      <!-- Título e Saudação -->
       
      <a href="loginCliente.html" class="logo" aria-label="Skadi">
        <img src="Imagens/logo.svg" alt="Skadi">
      </a>
      <h2 class="welcome-text">Área restrita!</h2>

      <!-- Formulário -->
      <form class="login-form">
        
        <!-- Campo: Usuário -->
        <div class="input-group">
          <input type="text" placeholder="Usuário" required>
        </div>

        <!-- Campo: Senha com ícone de visualizar -->
         <div class="input-group password-group">
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="button" class="olho" id="toggle-senha" aria-label="Mostrar senha" aria-pressed="false">
      <!-- olho aberto: senha escondida -->
      <img class="olho-aberto" src="Imagens/olho_ac.svg">
      <!-- olho riscado: senha visível -->
      <img class="olho-fechado" src="Imagens/olho_fc.svg">
    </button>
  </div>
         
        <!-- Botão: Entrar -->
        <button type="submit" class="btn btn-primary">Entrar</button>

        <!-- Link: Esqueceu a senha -->
        <a href="esqueciSenha.html" class="forgot-link">Esqueceu a senha?</a><br>

        <!-- Opção: Lembre-se de mim -->
        <div class="checkbox-group">
          <input id="remember", type="radio">
          <label for="remember">Lembre-se de mim</label><br />
        </div>
      </form>
    </div>
  </div>
<script>
const campoSenha = document.getElementById('senha');
const botaoOlho = document.getElementById('toggle-senha');

botaoOlho.addEventListener('click', () => {
  const mostrando = campoSenha.type === 'text';
  campoSenha.type = mostrando ? 'password' : 'text';
  botaoOlho.classList.toggle('ativo', !mostrando);
  botaoOlho.setAttribute('aria-pressed', String(!mostrando));
  botaoOlho.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
});

</script>

</body>
</html>
