<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOGIN CLIENTE</title>

  <!-- Fonte Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleLoginCliente.css">
</head>
<body>

  <!-- Bolas suaves de fundo -->
   <div class="blob blob-1"></div>
   <div class="blob blob-2"></div>
   <div class="blob blob-3"></div>
   
   <div class="login-container"></div>

    <!-- Botão de voltar (seta azul) -->
    <a href="index.html" class="back-btn" aria-label="Voltar">
      <img src="..\Imagens/seta_azul.svg" alt="">
    </a>

    <!-- LADO ESQUERDO: Ilustração do lobo -->
<div class="left-side">
  <img class="illustration" src="..\Imagens/lobao.svg" alt="Lobo Skadi">
</div>

<!-- LADO DIREITO: Formulário de Login -->
<div class="right-side">

  <!-- Logo e saudação -->
  <a href="loginSuperAdmin.html" class="logo" aria-label="Skadi">
    <img src="..\Imagens/logo.svg" alt="Skadi">
  </a>
  <h2 class="welcome-text">Bem vindo de volta!</h2>

  <!-- Formulário -->
  <form class="login-form" id="form-login">

    <!-- Campo: Usuário -->
    <div class="input-group">
      <input type="text" placeholder="Usuário" aria-label="Usuário" required>
    </div>

    <!-- Campo: Senha com ícone de visualizar -->
    <div class="input-group password-group">
      <input type="password" id="senha" placeholder="Senha" aria-label="Senha" required>
      <button type="button" class="olho" id="toggle-senha" aria-label="Mostrar senha" aria-pressed="false">
        <!-- olho aberto: senha escondida -->
        <img class="olho-aberto" src="..\Imagens/olho_ac.svg" alt="">
        <!-- olho riscado: senha visível -->
        <img class="olho-fechado" src="..\Imagens/olho_fc.svg" alt="">
      </button>
    </div>

    <!-- Botão: Entrar -->
    <button type="submit" class="btn btn-primary">Entrar</button>

    <!-- Link: Esqueceu a senha -->
    <a href="esqueciSenha.html" class="forgot-link">Esqueceu a senha?</a>

    <!-- Opção: Lembre-se de mim -->
    <div class="checkbox-group">
      <input id="remember" type="checkbox">
      <label for="remember">Lembre-se de mim</label>
    </div>

    <!-- Texto para criar conta -->
    <p class="signup-prompt">Ainda não tem uma conta?</p>

    <!-- Botão: Criar conta -->
    <button type="button" class="btn btn-secondary" onclick="window.location.href='contato.html'">Criar conta</button>
  </form>
</div>
  </div>

<script>
const campoSenha = document.getElementById('senha');
const botaoOlho = document.getElementById('toggle-senha');

botaoOlho.addEventListener('click', () => {
  const mostrando = campoSenha.type === 'text';
  campoSenha.type = mostrando ? 'password' : 'text';
  botaoOlho.classList.toggle('ativo', !mostrando);
  botaoOlho.setAttribute('aria-pressed', String(!mostrando));
  botaoOlho.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
});

// Redirecionar para a página do CRUD
const formularioLogin = document.getElementById('form-login');
formularioLogin.addEventListener('submit', (event) => {
  event.preventDefault();
  window.location.href = 'funcionarios.html';
});
</script>

</body>
</html>
