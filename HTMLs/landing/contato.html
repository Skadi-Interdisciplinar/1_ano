<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleContato.css">
</head>
<body>
  <main class="tela">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card-cadastro">
      <header class="topo">
        <a href="index.html" class="voltar" aria-label="Voltar">
            <img src="..\Imagens/seta_branca.svg">
        </a>
        <h1>Inicie sua jornada conosco!</h1>
      </header>

      <form class="formulario" id="formSignIn">
        <input type="text" name="nome" placeholder="Nome" autocomplete="given-name" required>
        <input type="text" name="sobrenome" placeholder="Sobrenome" autocomplete="family-name" required>
        <input type="text" name="empresa" placeholder="Nome da empresa" autocomplete="organization" required>
        <textarea name="mensagem" placeholder="Mensagem" minlength="10" required></textarea>

        <section class="btn-container">
          <button type="submit" class="btn-enviar">Enviar</button>
        </section>
      </form>

      <section class="login">
        <p>Já tem uma conta?</p>
        <a href="loginCliente.html" class="btn-entrar">Entrar</a>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="modalSucesso">
    <iframe src="msgEnviada.html" class="mensagem-iframe" title="Mensagem enviada com sucesso"></iframe>
  </div>

  <script>
    const formulario = document.getElementById('formSignIn');
    const modalSucesso = document.getElementById('modalSucesso');

    formulario.addEventListener('submit', function(event) {
      event.preventDefault();
      modalSucesso.classList.add('ativo');
    });
  </script>
</body>
</html>
