<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci a senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="esqueci.css">
</head>
<body>

  <!-- Botão de voltar (volta para informar o e-mail) -->
  <a href="esqueciSenha.html" class="back-btn" aria-label="Voltar">
    <img src="Imagens/seta.svg" alt="">
  </a>

  <div class="login-container">

    <!-- Bolas suaves de fundo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- LADO ESQUERDO: lobo -->
    <div class="left-side">
      <img class="illustration" src="Imagens/lobao.svg" alt="Lobo Skadi">
    </div>

    <!-- LADO DIREITO: conteúdo -->
    <div class="right-side">
      <a href="loginSistema.html" class="logo"><img src="Imagens/logo.svg" alt="Skadi"></a>

      <h2 class="titulo">Código de redefinição</h2>
      <p class="subtitulo">Digite o código que recebeu por e-mail para redefinir sua senha</p>

      <form class="form" id="form-codigo">
        <div class="input-group">
          <input type="text" id="codigo" placeholder="Código" inputmode="numeric" autocomplete="one-time-code" required>
        </div>

        <button type="submit" class="btn btn-primary">Prosseguir</button>
      </form>
    </div>
  </div>

<script>
document.getElementById('form-codigo').addEventListener('submit', (e) => {
  e.preventDefault();
  // aqui entra a validação do código quando o back-end existir
  window.location.href = 'esqueciRedefinir.html';
});
</script>

</body>
</html>
