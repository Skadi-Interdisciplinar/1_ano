<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mensagem enviada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleMensagem.css">
</head>
<body>
  <main class="cartao">

    <!-- Linhas decorativas -->
    <svg class="linhas" viewBox="0 0 529 860" preserveAspectRatio="none" aria-hidden="true">
      <path class="linha-clara" d="M240 0 C232 110 150 200 7 283"/>
      <path class="linha-media" d="M529 518 C470 530 410 580 377 632"/>
      <path class="linha-clara" d="M352 672 C336 730 342 800 358 860"/>
    </svg>

    <!-- Montanhas -->
    <svg class="montanhas" viewBox="0 0 529 382" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gMontanha" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#cfe5fd"/>
          <stop offset="1" stop-color="#a9d0f7"/>
        </linearGradient>
        <linearGradient id="gPico" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e3f0fd"/>
          <stop offset="1" stop-color="#a6cef5"/>
        </linearGradient>
      </defs>

      <rect x="392" y="0" width="137" height="130" fill="#adc9f2"/>
      <polygon points="439,130 529,130 529,310 529,382 460,260" fill="#72a2de"/>

      <rect x="0" y="240" width="66" height="142" fill="#a5cff5"/>
      <polygon points="192,52 274,222 274,382 66,382 66,240" fill="#b4d6f7"/>
      <polygon points="192,52 82,203 100,205 106,200" fill="#aec8e6"/>
      <polygon points="192,52 125,170 82,203" fill="#aec8e6"/>

      <polygon points="66,240 132,382 0,382" fill="url(#gPico)" stroke="#fff" stroke-width="1.5"/>

      <polygon points="377,0 529,382 201,382" fill="url(#gMontanha)"/>
      <line x1="377" y1="0" x2="201" y2="382" stroke="#fff" stroke-width="1.5"/>
      <line x1="377" y1="0" x2="529" y2="382" stroke="#fff" stroke-width="1"/>
    </svg>

    <!-- Ícone de sucesso -->
    <svg class="icone" viewBox="0 0 90 90" aria-hidden="true">
      <circle cx="42" cy="48" r="38" />
      <polyline points="26,44 42,58 78,20" />
    </svg>

    <h1>Mensagem enviada<br>com sucesso!</h1>

    <p class="subtitulo">
      Sua mensagem foi recebida!<br>
      Nossa equipe entrará em contato em breve.
    </p>

    <p class="agradecimento">
      Obrigado por contatar-se com<br>
      o Skadi!
    </p>

    <a href="#" class="btn-voltar">Voltar ao início</a>
  </main>
</body>
</html>
