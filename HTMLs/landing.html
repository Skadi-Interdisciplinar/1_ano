<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKADI</title>
    <link rel="stylesheet" href="styleLanding.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <img src="" alt="Logo SKADI">
        </div>

        <nav class="menu">
            <a href="#">Início</a>
            <a href="#">Benefícios</a>
            <a href="#">Planos e Preços</a>
            <a href="#">Sobre nós</a>
        </nav>

        <div class="login">
            <a href="#" class="registrar">Registrar-se</a>
            <a href="#" class="entrar">Entrar</a>
        </div>

    </header>


    <!-- PARTE PRINCIPAL -->
    <main class="hero">

        <!-- LADO ESQUERDO -->
        <section class="hero-text">

            <h1>
                A <span>tecnologia de</span><br>
                monitoramento que<br>
                previne o desperdício<br>
                em seus frigoríficos
            </h1>

            <p>
                Um software que lê seus termômetros em tempo real,
                calcula a redução da validade do produto e notifica
                sua equipe antes do descarte de lotes.
            </p>

            <button class="botao-principal">
                Proteger minha operação
            </button>

        </section>


        <!-- LADO DIREITO -->
        <section class="hero-image">

            <div class="forma-azul"></div>

            <img
                src="img/celular.png"
                alt="Aplicativo SKADI"
                class="celular"
            >

        </section>

    </main>


    <!-- BOTÃO DE AJUDA -->
    <button class="ajuda">

        <span>Precisa de ajuda?</span>

        <div class="icone-ajuda">
            <img src="img/logo.png" alt="SKADI">
        </div>

    </button>

</body>

</html>
