<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESQUECI A SENHA - REDEFINA A SENHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="esqueci.css">
</head>
<body>

  <!-- Botão de voltar (volta para o código) -->
  <a href="esqueciCodigo.html" class="back-btn" aria-label="Voltar">
    <img src="Imagens/seta.svg" alt="">
  </a>

  <div class="login-container">

    <!-- Bolas suaves de fundo -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- LADO ESQUERDO: lobo -->
    <div class="left-side">
      <img class="illustration" src="Imagens/lobao.svg" alt="Lobo Skadi">
    </div>

    <!-- LADO DIREITO: conteúdo -->
    <div class="right-side">
      <a href="loginSistema.html" class="logo"><img src="Imagens/logo.svg" alt="Skadi"></a>

      <h2 class="titulo">Redefina a senha</h2>
      <p class="subtitulo">Digite a sua nova senha para voltar a ter acesso a sua conta</p>

      <form class="form" id="form-senha">
        <div class="input-group">
          <input type="password" id="nova-senha" placeholder="Nova senha" autocomplete="new-password" required>
        </div>

        <div class="input-group">
          <input type="password" id="confirma-senha" placeholder="Confirme a senha" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary">Voltar para login</button>
      </form>
    </div>
  </div>

<script>
const novaSenha = document.getElementById('nova-senha');
const confirmaSenha = document.getElementById('confirma-senha');

// avisa (balão nativo do navegador) quando as senhas não são iguais
function validarSenhas() {
  confirmaSenha.setCustomValidity(
    confirmaSenha.value !== novaSenha.value ? 'As senhas não coincidem.' : ''
  );
}
novaSenha.addEventListener('input', validarSenhas);
confirmaSenha.addEventListener('input', validarSenhas);

document.getElementById('form-senha').addEventListener('submit', (e) => {
  e.preventDefault();
  // aqui entra o salvamento da nova senha quando o back-end existir
  window.location.href = 'loginCliente.html';
});
</script>

</body>
</html>
